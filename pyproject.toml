[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webscan-light"
version = "1.0.0"
description = "A free, self-hosted website vulnerability scanner with CLI and web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "scanner", "vulnerability", "cve", "owasp", "pentest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.28",
  "beautifulsoup4>=4.11",
  "jinja2>=3.1",
  "rich>=13.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.27"]
all = ["webscan-light[web,dev]"]

[project.scripts]
webscan = "webscan.cli:main"

[project.urls]
Homepage = "https://github.com/lewisjohnvillamor/webscan-light"
Issues = "https://github.com/lewisjohnvillamor/webscan-light/issues"

[tool.setuptools.packages.find]
include = ["webscan*"]

[tool.setuptools.package-data]
webscan = ["report/templates/*.j2", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
