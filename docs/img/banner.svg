<svg width="1280" height="448" viewBox="0 0 1280 448" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">
  <defs>
    <style>
      .ink   { fill: #1c1b18; }
      .muted { fill: #6f6b63; }
      .faint { fill: #97928a; }
      .rule  { stroke: #dcd9d1; }
      .hair  { stroke: #e6e3db; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="448" fill="#f7f6f3"/>
  <!-- hairline frame -->
  <rect x="28.5" y="28.5" width="1223" height="391" fill="none" class="rule" stroke-width="1"/>

  <!-- faint dotted-grid accent, top-left, very subtle -->
  <g fill="#e4e1d9">
    <circle cx="72" cy="72" r="1.4"/><circle cx="102" cy="72" r="1.4"/><circle cx="132" cy="72" r="1.4"/>
    <circle cx="72" cy="102" r="1.4"/><circle cx="102" cy="102" r="1.4"/><circle cx="132" cy="102" r="1.4"/>
  </g>

  <!-- monogram code block -->
  <rect x="72" y="150" width="70" height="70" rx="8" fill="none" class="rule" stroke-width="1.5"/>
  <text x="107" y="196" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="1" class="ink">WS</text>

  <!-- wordmark -->
  <text x="168" y="180" font-size="52" font-weight="700" letter-spacing="-1" class="ink">webscan<tspan class="faint">-</tspan>light</text>
  <text x="170" y="216" font-size="19" font-weight="500" letter-spacing="0.3" class="muted">Self-hosted website vulnerability scanner &#183; CLI + Web UI</text>

  <!-- tool-code chips -->
  <g font-size="13" font-weight="600" letter-spacing="0.5">
    <g>
      <rect x="72"  y="266" width="52" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="98"  y="286" text-anchor="middle" class="muted">WEB</text>
      <rect x="132" y="266" width="52" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="158" y="286" text-anchor="middle" class="muted">TLS</text>
      <rect x="192" y="266" width="52" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="218" y="286" text-anchor="middle" class="muted">PRT</text>
      <rect x="252" y="266" width="52" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="278" y="286" text-anchor="middle" class="muted">SUB</text>
      <rect x="312" y="266" width="52" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="338" y="286" text-anchor="middle" class="muted">FUZ</text>
      <rect x="372" y="266" width="52" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="398" y="286" text-anchor="middle" class="muted">API</text>
      <rect x="432" y="266" width="52" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="458" y="286" text-anchor="middle" class="muted">DNS</text>
      <rect x="492" y="266" width="52" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="518" y="286" text-anchor="middle" class="muted">ASM</text>
      <rect x="552" y="266" width="52" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="578" y="286" text-anchor="middle" class="muted">DEP</text>
      <rect x="612" y="266" width="60" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="642" y="286" text-anchor="middle" class="faint">+15</text>
    </g>
  </g>

  <!-- format / license footer line -->
  <text x="72" y="360" font-size="14" font-weight="500" letter-spacing="0.4" class="faint">HTML &#183; PDF &#183; JSON &#183; SARIF &#160;&#160;&#8212;&#160;&#160; OWASP / PCI / ASVS mapping &#160;&#160;&#8212;&#160;&#160; AGPL-3.0 &#183; no API keys</text>

  <!-- right: grade gauge motif (echoes the report) -->
  <g transform="translate(1060,164)">
    <!-- track -->
    <circle cx="60" cy="60" r="54" fill="none" stroke="#e6e3db" stroke-width="12"/>
    <!-- progress arc ~ grade A (about 88%) -->
    <circle cx="60" cy="60" r="54" fill="none" stroke="#8aa17d" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="298 339" transform="rotate(-90 60 60)"/>
    <text x="60" y="70" text-anchor="middle" font-size="46" font-weight="700" class="ink">A</text>
    <text x="60" y="152" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.5" class="muted">SECURITY GRADE</text>
  </g>

  <!-- small severity legend under gauge, right -->
  <g font-size="11" font-weight="600" letter-spacing="0.5" text-anchor="middle" class="faint">
    <text x="1120" y="352">DETECT &#183; SAFE POC &#183; AUTHORIZED USE ONLY</text>
  </g>
</svg>
