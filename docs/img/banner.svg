<svg width="1280" height="448" viewBox="0 0 1280 448" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace">
  <defs>
    <style>
      .ink   { fill: #1c1b18; }
      .muted { fill: #6f6b63; }
      .faint { fill: #97928a; }
      .rule  { stroke: #dcd9d1; }
      .hair  { stroke: #e6e3db; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="448" fill="#f7f6f3"/>
  <!-- hairline frame -->
  <rect x="28.5" y="28.5" width="1223" height="391" fill="none" class="rule" stroke-width="1"/>

  <!-- grade gauge as the centered mark -->
  <g transform="translate(580,52)">
    <circle cx="60" cy="60" r="42" fill="none" stroke="#e6e3db" stroke-width="10"/>
    <circle cx="60" cy="60" r="42" fill="none" stroke="#8aa17d" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="232 264" transform="rotate(-90 60 60)"/>
    <text x="60" y="74" text-anchor="middle" font-size="38" font-weight="700" class="ink">A</text>
  </g>

  <!-- wordmark (centered) -->
  <text x="640" y="230" text-anchor="middle" font-size="50" font-weight="700" letter-spacing="-1" class="ink">webscan<tspan class="faint">-</tspan>light</text>
  <!-- tagline (centered) -->
  <text x="640" y="264" text-anchor="middle" font-size="18" font-weight="500" letter-spacing="0.3" class="muted">Self-hosted website vulnerability scanner &#183; CLI + Web UI</text>

  <!-- tool-code chips (centered row) -->
  <g font-size="13" font-weight="600" letter-spacing="0.5" text-anchor="middle">
    <g><rect x="325" y="294" width="54" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="352" y="314" class="muted">WEB</text></g>
    <g><rect x="389" y="294" width="54" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="416" y="314" class="muted">TLS</text></g>
    <g><rect x="453" y="294" width="54" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="480" y="314" class="muted">PRT</text></g>
    <g><rect x="517" y="294" width="54" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="544" y="314" class="muted">SUB</text></g>
    <g><rect x="581" y="294" width="54" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="608" y="314" class="muted">FUZ</text></g>
    <g><rect x="645" y="294" width="54" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="672" y="314" class="muted">API</text></g>
    <g><rect x="709" y="294" width="54" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="736" y="314" class="muted">DNS</text></g>
    <g><rect x="773" y="294" width="54" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="800" y="314" class="muted">ASM</text></g>
    <g><rect x="837" y="294" width="54" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="864" y="314" class="muted">DEP</text></g>
    <g><rect x="901" y="294" width="54" height="30" rx="6" fill="none" class="hair" stroke-width="1"/><text x="928" y="314" class="faint">+15</text></g>
  </g>

  <!-- footer line (centered) -->
  <text x="640" y="356" text-anchor="middle" font-size="14" font-weight="500" letter-spacing="0.4" class="muted">HTML &#183; PDF &#183; JSON &#183; SARIF &#160;&#160;&#8212;&#160;&#160; OWASP / PCI / ASVS mapping &#160;&#160;&#8212;&#160;&#160; AGPL-3.0 &#183; no API keys</text>
</svg>
