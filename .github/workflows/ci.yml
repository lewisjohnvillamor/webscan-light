name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[web,dev]"
      - name: Test
        run: pytest -q
      - name: Smoke-test the CLI
        run: |
          webscan --version
          test "$(webscan list-tests | head -1)" = "webscan-light performs 40 tests:"
