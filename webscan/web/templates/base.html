<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}webscan-light{% endblock %}</title>
<style>
  :root {
    --ink:#0f172a; --muted:#64748b; --faint:#94a3b8; --line:#e6eaf0; --line-soft:#eef1f6;
    --bg:#f4f6fb; --card:#fff; --panel:#f8fafc; --accent:#4f46e5; --accent-soft:#eef2ff;
    --track:#eef1f6; --critical:#8b1a1a; --high:#e5484d; --medium:#f5a524; --low:#4b7bec; --info:#12b886;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.14); --radius:16px;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --ink:#e8edf5; --muted:#9aa6b8; --faint:#6b7688; --line:#232b3a; --line-soft:#1c2432;
    --bg:#0b0f17; --card:#141b26; --panel:#0f1620; --accent:#7c8cff; --accent-soft:#1b2136;
    --track:#232b3a; --critical:#c0392b; --high:#f2555a; --medium:#f7b955; --low:#5b8def; --info:#20c997;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  }}
  :root[data-theme="dark"]{ --ink:#e8edf5; --muted:#9aa6b8; --faint:#6b7688; --line:#232b3a;
    --line-soft:#1c2432; --bg:#0b0f17; --card:#141b26; --panel:#0f1620; --accent:#7c8cff;
    --accent-soft:#1b2136; --track:#232b3a; --critical:#c0392b; --high:#f2555a; --medium:#f7b955;
    --low:#5b8def; --info:#20c997; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14.5px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 20px 72px}
  header.top{display:flex;align-items:center;gap:13px;padding-bottom:18px;
    border-bottom:1px solid var(--line);margin-bottom:26px;flex-wrap:wrap}
  header.top .glyph{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
    color:#fff;font-size:19px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000))}
  header.top h1{font-size:18px;margin:0;letter-spacing:-.02em}
  header.top h1 a{color:inherit}
  header.top .tag{color:var(--muted);font-size:12.5px}
  header.top .spacer{flex:1}
  header.top nav a{color:var(--muted);font-size:13px;font-weight:600;margin-left:16px}
  header.top nav a:hover{color:var(--accent)}
  h2{font-size:15px;margin:0 0 14px;letter-spacing:-.01em}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);margin:26px 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow)}
  .pad{padding:22px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  input[type=text],input[type=number],input[type=url]{width:100%;padding:11px 13px;font-size:14px;
    color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .field{margin-bottom:16px}
  .checks{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 18px}
  .checks label{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);
    font-size:13px;margin:0;cursor:pointer}
  button,.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;font-size:14px;
    font-weight:600;border:1px solid var(--accent);border-radius:9px;background:var(--accent);
    color:#fff;cursor:pointer;text-decoration:none}
  .btn.secondary{background:transparent;color:var(--accent)}
  button:hover,.btn:hover{filter:brightness(1.08);text-decoration:none}
  .hint{color:var(--muted);font-size:12.5px;margin-top:10px}
  .sev-critical{color:var(--critical)}.sev-high{color:var(--high)}.sev-medium{color:var(--medium)}
  .sev-low{color:var(--low)}.sev-info{color:var(--info)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .toolcard{display:flex;flex-direction:column;gap:8px;padding:17px 18px;text-decoration:none;
    color:inherit;position:relative;transition:transform .15s ease,box-shadow .2s ease}
  .toolcard:hover{transform:translateY(-2px);text-decoration:none;
    box-shadow:0 2px 4px rgba(15,23,42,.05),0 16px 40px -18px rgba(15,23,42,.3)}
  .toolcard .ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
    font-size:21px;background:var(--accent-soft)}
  .toolcard .nm{font-weight:700;font-size:14.5px}
  .toolcard .ds{font-size:12px;color:var(--muted);line-height:1.45}
  .toolcard .flag{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:700;
    letter-spacing:.05em;color:var(--medium);background:color-mix(in srgb,var(--medium) 14%,transparent);
    border:1px solid color-mix(in srgb,var(--medium) 30%,transparent);padding:2px 7px;border-radius:99px}
  table.list{width:100%;border-collapse:collapse;font-size:13px}
  table.list th,table.list td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-soft)}
  table.list th{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  table.list tr:last-child td{border-bottom:0}
  .notice{display:flex;gap:9px;padding:12px 15px;border-radius:11px;background:var(--panel);
    border:1px solid var(--line-soft);color:var(--muted);font-size:12.5px;margin-bottom:18px}
  .warn{background:color-mix(in srgb,var(--medium) 12%,transparent);
    border-color:color-mix(in srgb,var(--medium) 30%,transparent)}
  code{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;padding:1px 6px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  footer{color:var(--faint);font-size:12px;margin-top:34px;text-align:center}
  @media (max-width:560px){ul.testlist{columns:1}}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="glyph">🛡</div>
    <h1><a href="/">webscan-light</a></h1>
    <span class="tag">self-hosted scanning suite</span>
    <span class="spacer"></span>
    <nav>
      <a href="/">Tools</a>
      <a href="/logger">Request Logger</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
  <footer>webscan-light v{{ version }} · free &amp; self-hosted · scan only what you are authorised to test</footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
