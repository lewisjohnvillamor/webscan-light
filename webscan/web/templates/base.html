<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}webscan-light{% endblock %}</title>
<style>
  :root{
    --bg:#f7f6f3;--card:#fff;--panel:#faf9f7;--ink:#23262b;--muted:#787774;--faint:#9b9a95;
    --line:#e8e6e1;--line-soft:#efede8;--track:#ecebe6;--accent:#1f6c9f;--cta:#161616;--cta-ink:#fff;
    --critical:#7a1f1d;--high:#9f2f2d;--high-bg:#fdebec;--medium:#8a5a00;--low:#1f6c9f;--info:#346538;--info-bg:#edf3ec;
    --mono:ui-monospace,"SF Mono","Geist Mono","JetBrains Mono",Menlo,monospace;
    --sans:"SF Pro Display","Geist Sans","Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;
    --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.02);--shadow-hover:0 2px 8px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e0f0d;--card:#171815;--panel:#131412;--ink:#e7e6e1;--muted:#a09e97;--faint:#6f6e68;
    --line:#262723;--line-soft:#201f1c;--track:#242420;--accent:#7bb7dd;--cta:#e7e6e1;--cta-ink:#161616;
    --critical:#e08a86;--high:#e59a97;--high-bg:#271817;--medium:#d9b25f;--low:#7bb7dd;--info:#7fbd82;--info-bg:#152018;
    --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-hover:0 3px 12px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{--bg:#0e0f0d;--card:#171815;--panel:#131412;--ink:#e7e6e1;--muted:#a09e97;
    --faint:#6f6e68;--line:#262723;--line-soft:#201f1c;--track:#242420;--accent:#7bb7dd;--cta:#e7e6e1;
    --cta-ink:#161616;--critical:#e08a86;--high:#e59a97;--high-bg:#271817;--medium:#d9b25f;--low:#7bb7dd;
    --info:#7fbd82;--info-bg:#152018;--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-hover:0 3px 12px rgba(0,0,0,.4)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:2px}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
  header.top{display:flex;align-items:baseline;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line);
    margin-bottom:26px;flex-wrap:wrap}
  header.top .code{font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--muted);border:1px solid var(--line);
    border-radius:6px;padding:6px 9px;text-transform:uppercase}
  header.top h1{font-size:16px;margin:0;font-weight:600;letter-spacing:-.02em}
  header.top h1 a{color:inherit}
  header.top .tag{color:var(--faint);font:11.5px var(--mono)}
  header.top .spacer{flex:1}
  header.top nav a{color:var(--muted);font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-left:18px}
  header.top nav a:hover{color:var(--ink)}
  h2{font-size:15px;margin:0 0 12px;font-weight:600;letter-spacing:-.01em}
  .eyebrow{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:28px 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .grid+.eyebrow,.card+.eyebrow{margin-top:26px}
  .pad{padding:20px}
  label{display:block;font:600 11px/1 var(--mono);color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  input[type=text],input[type=number],input[type=url]{width:100%;padding:11px 13px;font:14px var(--sans);color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:9px}
  input:focus{outline:2px solid var(--ink);outline-offset:-1px}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
  .field{margin-bottom:16px}
  .checks{display:flex;gap:20px;flex-wrap:wrap;margin:4px 0 20px}
  .checks label{display:flex;align-items:center;gap:8px;font:13px var(--sans);color:var(--ink);margin:0;
    cursor:pointer;text-transform:none;letter-spacing:0}
  button,.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;font:600 13px var(--sans);
    border:1px solid var(--cta);border-radius:9px;background:var(--cta);color:var(--cta-ink);cursor:pointer;
    text-decoration:none;transition:transform .12s ease}
  button:active,.btn:active{transform:scale(.98)}
  .btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
  button:hover,.btn:hover{text-decoration:none}
  .btn.secondary:hover{border-color:var(--muted)}
  .hint{color:var(--muted);font-size:12.5px;margin-top:10px}
  .sev-critical{color:var(--critical)}.sev-high{color:var(--high)}.sev-medium{color:var(--medium)}
  .sev-low{color:var(--low)}.sev-info{color:var(--info)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
  .toolcard{display:flex;flex-direction:column;gap:9px;padding:16px;text-decoration:none;color:inherit;
    position:relative;transition:box-shadow .2s ease}
  .toolcard:hover{text-decoration:none;box-shadow:var(--shadow-hover)}
  .toolcard .ico{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
    font:600 12px/1 var(--mono);letter-spacing:.04em;color:var(--muted);background:var(--panel);
    border:1px solid var(--line)}
  .toolcard .nm{font-weight:600;font-size:14px;letter-spacing:-.01em}
  .toolcard .ds{font-size:12px;color:var(--muted);line-height:1.5}
  .toolcard .flag{position:absolute;top:14px;right:14px;font:600 9px/1 var(--mono);letter-spacing:.08em;
    color:var(--medium);border:1px solid color-mix(in srgb,var(--medium) 30%,transparent);padding:3px 7px;border-radius:5px}
  table.list{width:100%;border-collapse:collapse;font-size:13px}
  table.list th,table.list td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line-soft)}
  table.list th{color:var(--faint);font:600 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em}
  table.list tr:last-child td{border-bottom:0}
  table.list td:nth-child(2){font-family:var(--mono);font-size:12px}
  .notice{display:block;padding:13px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--line-soft);
    color:var(--muted);font-size:12.5px;margin-bottom:18px}
  .notice.warn{background:var(--high-bg);border-color:color-mix(in srgb,var(--high) 30%,transparent);color:var(--ink)}
  code{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;padding:1px 6px;font:12.5px var(--mono)}
  footer{color:var(--faint);font:11.5px var(--mono);margin-top:32px;text-align:center}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="code">webscan</span>
    <h1><a href="/">webscan-light</a></h1>
    <span class="tag">self-hosted scanning suite</span>
    <span class="spacer"></span>
    <nav><a href="/">Tools</a><a href="/history">History</a><a href="/schedules">Schedules</a><a href="/logger">Request Logger</a></nav>
  </header>
  {% block content %}{% endblock %}
  <footer>webscan-light v{{ version }} — free &amp; self-hosted — scan only what you are authorised to test</footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
