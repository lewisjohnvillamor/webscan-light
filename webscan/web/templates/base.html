<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}webscan-light{% endblock %}</title>
<style>
  :root {
    --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#f9fafb; --card:#fff;
    --accent:#1d4ed8; --accent-ink:#fff;
    --critical:#7b1d1d; --high:#d93a2b; --medium:#e88c1a; --low:#2f80d8; --info:#7a8596;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e5e7eb; --muted:#9aa4b2; --line:#2a3140; --bg:#0f131a; --card:#161b24;
            --accent:#5b8def; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:940px; margin:0 auto; padding:28px 20px 60px; }
  header.top { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
               padding-bottom:16px; border-bottom:1px solid var(--line); margin-bottom:26px; }
  header.top h1 { font-size:19px; margin:0; letter-spacing:-.2px; }
  header.top h1 a { color:inherit; text-decoration:none; }
  header.top .tag { color:var(--muted); font-size:12px; }
  header.top .spacer { flex:1; }
  a { color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:22px; margin-bottom:20px; }
  h2 { font-size:15px; margin:0 0 14px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  input[type=text], input[type=number], input[type=url] {
    width:100%; padding:10px 12px; font-size:14px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:7px;
  }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .field { margin-bottom:16px; }
  .checks { display:flex; gap:20px; flex-wrap:wrap; margin:6px 0 20px; }
  .checks label { display:flex; align-items:center; gap:7px; font-weight:400;
                  color:var(--ink); font-size:13px; margin:0; cursor:pointer; }
  button, .btn {
    display:inline-block; padding:10px 18px; font-size:14px; font-weight:600;
    border:1px solid var(--accent); border-radius:7px; background:var(--accent);
    color:var(--accent-ink); cursor:pointer; text-decoration:none;
  }
  .btn.secondary { background:transparent; color:var(--accent); }
  button:hover, .btn:hover { filter:brightness(1.08); }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  .sev { font-weight:700; }
  .sev-critical{color:var(--critical)} .sev-high{color:var(--high)}
  .sev-medium{color:var(--medium)} .sev-low{color:var(--low)} .sev-info{color:var(--info)}
  table.list { width:100%; border-collapse:collapse; font-size:13px; }
  table.list th, table.list td { text-align:left; padding:8px 10px;
                                 border-bottom:1px solid var(--line); }
  table.list th { color:var(--muted); font-size:11px; text-transform:uppercase;
                  letter-spacing:.4px; }
  details.tests summary { cursor:pointer; color:var(--muted); font-size:13px; }
  ul.testlist { columns:2; column-gap:30px; font-size:12.5px; color:var(--muted);
                margin:12px 0 0; padding-left:18px; }
  ul.testlist li { break-inside:avoid; padding:1px 0; }
  footer { color:var(--muted); font-size:12px; margin-top:34px; text-align:center; }
  @media (max-width:640px){ ul.testlist{columns:1} }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><a href="/">webscan-light</a></h1>
    <span class="tag">self-hosted website vulnerability scanner</span>
    <span class="spacer"></span>
    <span class="tag">v{{ version }}</span>
  </header>
  {% block content %}{% endblock %}
  <footer>Free and self-hosted · scan only systems you are authorised to test</footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
