{% extends "base.html" %}
{% block title %}Sign in — webscan-light{% endblock %}
{% block content %}
<div class="card pad" style="max-width:420px;margin:8vh auto 0">
  <h2>Sign in</h2>
  <p class="hint" style="margin-top:0">This instance is protected by an access token.</p>
  {% if error %}<div class="notice warn" style="margin-top:12px">{{ error }}</div>{% endif %}
  <form method="post" action="/login" style="margin-top:14px">
    <div class="field">
      <label for="token">Access token</label>
      <input type="text" id="token" name="token" autofocus autocomplete="off" placeholder="WEBSCAN_TOKEN">
    </div>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
