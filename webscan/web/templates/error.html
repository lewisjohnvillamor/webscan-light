{% extends "base.html" %}
{% block title %}Scan failed{% endblock %}
{% block content %}
<div class="card">
  <h2>Scan failed</h2>
  <p><strong>{{ job.target }}</strong></p>
  <p style="color:var(--muted)">{{ job.error }}</p>
  <div style="margin-top:16px"><a class="btn" href="/">Try another target</a></div>
</div>
{% endblock %}
